<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZR · Painel financeiro</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@500;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet"><script src="zr-google-config.js"></script><style>
body{margin:0;background:#101216;color:#fff;font:14px Manrope,Arial}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.top{padding:22px 0;border-bottom:1px solid #292b30;display:flex;justify-content:space-between;align-items:center}.brand{font:600 27px/.8 Oswald;letter-spacing:.05em}.brand small{display:block;color:#aaa;font:500 8px 'DM Mono';letter-spacing:.16em;margin-top:6px}.back{color:#fff;text-decoration:none;border:1px solid #3a3c41;padding:10px 13px;font:500 10px 'DM Mono';text-transform:uppercase}.page{padding:48px 0}.eyebrow{color:#ed3e31;font:500 10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}.title{font:600 48px/.95 Oswald;text-transform:uppercase;margin:12px 0 30px}.cards{display:flex;gap:14px;margin-bottom:28px}.card{border:1px solid #31343a;background:#15171b;padding:20px;min-width:210px}.card small{color:#aeb1b6;font:500 9px 'DM Mono';letter-spacing:.09em;text-transform:uppercase}.card b{display:block;font:600 29px Oswald;color:#fff;margin-top:7px}.card.alert b{color:#ed3e31}table{width:100%;border-collapse:collapse;background:#15171b;border:1px solid #31343a}th,td{padding:14px;text-align:left;border-bottom:1px solid #2b2d31;font-size:12px}th{font:500 9px 'DM Mono';color:#aeb1b6;letter-spacing:.08em;text-transform:uppercase}.ok{color:#5cd97c}.pending{color:#d7b37a}button{border:1px solid #5cd97c;color:#5cd97c;background:transparent;padding:7px 10px;font:500 9px 'DM Mono';text-transform:uppercase;cursor:pointer}.login{max-width:440px;border:1px solid #31343a;background:#15171b;padding:24px}.login label{display:block;color:#aeb1b6;font:500 9px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;margin:16px 0 7px}.login input{box-sizing:border-box;width:100%;background:#101216;border:1px solid #363940;color:#fff;padding:12px;font:14px Manrope}.login button{margin-top:14px}.message{min-height:20px;color:#aeb1b6}.message.err{color:#ed3e31}.hidden{display:none}@media(max-width:700px){.cards{flex-wrap:wrap}.title{font-size:39px}table{display:block;overflow:auto}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">ZR<small>PAINEL FINANCEIRO</small></div><a class="back" href="ZR%20%E2%80%94%20Est%C3%A9tica%20Automotiva%20em%20Guaruj%C3%A1%20%E2%80%94%20Google%20Agenda.html">Voltar ao site</a></header></main><main class="wrap page"><div class="eyebrow">Controle da ZR</div><h1 class="title">Agenda & financeiro</h1><section id="login" class="login"><p>Informe o código do painel para ver os agendamentos.</p><label for="token">Código do painel</label><input id="token" type="password" autocomplete="current-password"><button id="enter" type="button">Entrar</button><p id="loginMessage" class="message"></p></section><section id="dashboard" class="hidden"><div class="cards"><div class="card"><small>Total agendado</small><b id="total">R$ 0,00</b></div><div class="card alert"><small>PIX pendente</small><b id="pending">R$ 0,00</b></div></div><p id="message" class="message"></p><table><thead><tr><th>Data</th><th>Cliente / veículo</th><th>Serviço</th><th>Valor</th><th>Pagamento</th><th>PIX</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
const api=window.ZR_GOOGLE_API,fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const $=id=>document.getElementById(id);let token=sessionStorage.getItem('zrDashboardToken')||'';
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function request(action,{get,post}={}){if(!api)throw Error('Configure a URL do Google Apps Script em zr-google-config.js.');const u=new URL(api);u.searchParams.set('action',action);if(get)Object.entries(get).forEach(([k,v])=>u.searchParams.set(k,v));const response=await fetch(u,post?{method:'POST',body:JSON.stringify(post)}:{});if(!response.ok)throw Error('Não foi possível conectar ao Apps Script.');return response.json();}
function setMessage(id,text,error=false){const el=$(id);el.textContent=text;el.classList.toggle('err',error);}
async function load(){try{const d=await request('dashboard',{get:{token}});if(d.error)throw Error(d.error);$('total').textContent=fmt(d.total);$('pending').textContent=fmt(d.pending);$('rows').innerHTML=(d.items||[]).map(x=>{const paid=x.pixStatus==='Pago'||x.payment!=='PIX';return `<tr><td>${escapeHtml(x.date)} · ${escapeHtml(x.time)}</td><td>${escapeHtml(x.name)}<br><small>${escapeHtml(x.vehicle)}</small></td><td>${escapeHtml(x.service)}</td><td>${fmt(x.value)}</td><td>${escapeHtml(x.payment)}</td><td class="${paid?'ok':'pending'}">${escapeHtml(x.pixStatus)}</td><td>${x.payment==='PIX'&&x.pixStatus==='Pendente'?`<button data-id="${escapeHtml(x.id)}">Marcar pago</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan="7">Nenhum agendamento registrado.</td></tr>';$('dashboard').classList.remove('hidden');$('login').classList.add('hidden');document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>markPaid(button.dataset.id)));}catch(err){sessionStorage.removeItem('zrDashboardToken');$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');setMessage('loginMessage',err.message||'Não foi possível carregar o painel.',true);}}
async function markPaid(id){try{const d=await request('payment',{post:{action:'payment',token,id,status:'Pago'}});if(d.error)throw Error(d.error);await load();}catch(err){setMessage('message',err.message||'Não foi possível atualizar o pagamento.',true);}}
function enter(){token=$('token').value.trim();if(!token)return setMessage('loginMessage','Informe o código do painel.',true);sessionStorage.setItem('zrDashboardToken',token);load();}$('enter').addEventListener('click',enter);$('token').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});if(token)load();
</script></body></html>
